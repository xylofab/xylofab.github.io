<style>
.side button { flex: 1 1 200px; font: inherit; font-weight: 700; text-align: left; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 0; cursor: pointer; background: transparent; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.side button[aria-current="page"] { background: #fff; color: var(--ink); }
.row { font: inherit; text-align: left; color: #fff; background: var(--ink-2); border: 0; border-radius: 20px; padding: 20px; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; width: 100%; transition: transform .25s, background-color .25s; }
.row:hover { transform: translateX(4px); background: #17213B; }
.status { font-weight: 800; padding: 6px 12px; border-radius: 999px; color: var(--ink); }
.steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.steps li { display: flex; flex-direction: column; gap: 8px; font-weight: 800; }
.steps li span { height: 6px; border-radius: 3px; background: var(--line); }
.star { width: 50px; height: 50px; border-radius: 12px; border: 0; background: var(--ink); cursor: pointer; font-size: 26px; color: var(--line-2); }
.star[aria-pressed="true"] { color: #FFB020; }
.auth-tabs { display: flex; gap: 4px; background: #F0F2F7; padding: 4px; border-radius: 999px; }
.auth-tabs button { font: inherit; font-weight: 800; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer; background: transparent; color: var(--ink); }
.auth-tabs button[aria-selected="true"] { background: #fff; }
</style>
</head>
<body data-page="conta">
<header id="site-header"></header>
<main id="app" class="wrap" style="padding-top: 36px; padding-bottom: 96px"></main>
<footer id="site-footer"></footer>
<script src="assets/config.js?v=1"></script>
<script src="assets/site.js?v=8"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var L = XF.L;
  var qs = new URLSearchParams(location.search);
  var st = { mode: qs.get('repor') ? 'reset' : qs.get('criar') ? 'signup' : 'login', email: qs.get('email') || '', name: '', error: '', info: '', tab: 'resumo', order: null, rating: {}, confirm: false, adding: false };
  var STEPS = ['paga', 'fila', 'imprimir', 'enviada', 'entregue'];
  var STEP_NAMES = { paga: ['Paga', 'Paid'], fila: ['Na fila', 'In queue'], imprimir: ['A imprimir', 'Printing'], enviada: ['Enviada', 'Shipped'], entregue: ['Entregue', 'Delivered'] };
  var STEP_COL = { paga: '#C9D3E8', fila: '#C9D3E8', imprimir: '#FF5A1F', enviada: '#FFB020', entregue: '#22C07A' };
  var sn = function (s) { return XF.L(STEP_NAMES[s][0], STEP_NAMES[s][1]); };

  /* ---------- entrar / criar conta ---------- */
  function authView() {
    var m = st.mode;
    var title = { signup: L('Cria a tua conta', 'Create your account'), login: L('Bem-vindo de volta', 'Welcome back'), forgot: L('Recuperar a palavra-passe', 'Reset your password'), reset: L('Nova palavra-passe', 'New password'), sent: L('Está a caminho', 'On its way') }[m];
    var body = '';
    if (m === 'sent' && XF.API) body = '<div style="background:#EAF8F1;color:#146C45;border-radius:16px;padding:16px;font-weight:700">' + L('Se houver uma conta com ', 'If there is an account for ') + XF.esc(st.email) + L(', enviámos um link para escolheres uma palavra-passe nova. Vê também o spam.', ', we sent a link to choose a new password. Check your spam folder too.') + '</div><button type="button" class="link-btn" style="color:#3B4664" data-mode="login">← ' + L('Voltar', 'Back') + '</button>';
    else if (m === 'sent') body = '<div style="background:#EAF8F1;color:#146C45;border-radius:16px;padding:16px;font-weight:700">' + L('No site real, enviamos um link para ', 'On the live site we send a link to ') + XF.esc(st.email) + L('. No modo de teste, cria uma conta nova com outra palavra-passe.', '. In test mode, create a new account with another password.') + '</div><button type="button" class="link-btn" style="color:#3B4664" data-mode="login">← ' + L('Voltar', 'Back') + '</button>';
    else body =
      (m === 'reset' ? '<label class="field">' + L('Palavra-passe nova', 'New password') + '<input id="a-newpw" type="password" autocomplete="new-password"></label>' : '') +
      (m === 'signup' ? '<label class="field">' + L('Nome', 'Name') + '<input id="a-name" autocomplete="name" value="' + XF.esc(st.name) + '"></label>' : '') +
      (m !== 'reset' ? '<label class="field">Email<input id="a-email" type="email" autocomplete="email" value="' + XF.esc(st.email) + '"></label>' : '') +
      (m !== 'forgot' && m !== 'reset' ? '<label class="field">' + L('Palavra-passe', 'Password') + '<input id="a-pw" type="password" autocomplete="' + (m === 'signup' ? 'new-password' : 'current-password') + '"></label>' : '') +
      (m === 'signup' ? '<label class="check"><input id="a-terms" type="checkbox"><span>' + L('Aceito os <a href="termos.html" style="color:#B3380C">termos</a> e a <a href="privacidade.html" style="color:#B3380C">política de privacidade</a>', 'I accept the <a href="termos.html" style="color:#B3380C">terms</a> and the <a href="privacidade.html" style="color:#B3380C">privacy policy</a>') + '</span></label><label class="check"><input id="a-lab" type="checkbox" checked style="accent-color:#22C07A"><span>' + L('Quero saber primeiro das novidades do Lab', 'Tell me first about Lab news') + '</span></label>' : '') +
      '<p class="error" role="alert">' + XF.esc(st.error) + '</p>' +
      '<button type="submit" class="btn btn-orange btn-big">' + { signup: L('Criar conta', 'Create account'), login: L('Entrar', 'Sign in'), forgot: L('Enviar link', 'Send link'), reset: L('Guardar e entrar', 'Save and sign in') }[m] + '</button>' +
      (m === 'login' ? '<button type="button" class="link-btn" style="color:#B3380C" data-mode="forgot">' + L('Esqueci-me da palavra-passe', 'I forgot my password') + '</button>' : '') +
      (m === 'forgot' ? '<button type="button" class="link-btn" style="color:#3B4664" data-mode="login">← ' + L('Voltar', 'Back') + '</button>' : '');
    return '<div class="sheet light" style="margin:24px auto;background:#fff;color:var(--ink)">' +
      '<div style="flex:1 1 280px;background:var(--ink);color:#fff;padding:34px;display:flex;flex-direction:column;gap:16px"><span style="width:60px;height:60px;display:inline-flex">' + XF.LOGO + '</span><p style="margin:0;font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1">' + L('Com conta,<br><span style="color:#FF5A1F">vês tudo a acontecer.</span>', 'With an account,<br><span style="color:#FF5A1F">you see it all happen.</span>') + '</p>' +
      '<ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;color:var(--mist)"><li>→ ' + L('Encomendas ao vivo, da fila até à porta.', 'Live orders, from the queue to your door.') + '</li><li>→ ' + L('Moradas, nomes e favoritos guardados.', 'Saved addresses, names and favourites.') + '</li><li style="color:#22C07A">→ ' + L('O Lab antes de toda a gente.', 'The Lab before anyone else.') + '</li></ul></div>' +
      '<form id="auth" novalidate style="flex:1 1 340px;padding:34px;display:flex;flex-direction:column;gap:14px">' +
      (m === 'signup' || m === 'login' ? '<div class="auth-tabs" role="tablist"><button type="button" role="tab" aria-selected="' + (m === 'signup') + '" data-mode="signup">' + L('Criar conta', 'Create account') + '</button><button type="button" role="tab" aria-selected="' + (m === 'login') + '" data-mode="login">' + L('Entrar', 'Sign in') + '</button></div>' : '') +
      '<h1 style="margin:0;font-size:28px;font-weight:900;letter-spacing:-.03em">' + title + '</h1>' + body + '</form></div>';
  }

  /* ---------- área de cliente ---------- */
  function myOrders(u) { return XF.API ? XF.orders() : XF.orders().filter(function (o) { return o.email === u.email; }); }
  function navView(u) {
    var os = myOrders(u), toRate = os.filter(function (o) { return o.status === 'entregue' && !o.review; }).length;
    var items = [['resumo', L('Resumo', 'Overview')], ['encomendas', L('Encomendas', 'Orders'), os.length || ''], ['moradas', L('Moradas', 'Addresses')], ['guardados', L('Nomes e favoritos', 'Names and favourites')], ['lab', 'Lab'], ['opinioes', L('Opiniões', 'Reviews'), toRate || ''], ['definicoes', L('Definições', 'Settings')]];
    return '<nav class="side" aria-label="' + L('A minha conta', 'My account') + '" style="flex:1 1 230px;display:flex;flex-direction:column;gap:4px"><p class="mono small" style="margin:0 0 8px 12px;font-weight:700;letter-spacing:.14em">' + L('A MINHA CONTA', 'MY ACCOUNT') + '</p><div style="display:flex;flex-wrap:wrap;gap:4px">' +
      items.map(function (it) { return '<button type="button" data-tab="' + it[0] + '"' + (st.tab === it[0] ? ' aria-current="page"' : '') + '>' + it[1] + (it[2] ? '<span class="badge">' + it[2] + '</span>' : '') + '</button>'; }).join('') +
      '</div><button type="button" class="link-btn" data-logout style="text-align:left;padding-left:14px;margin-top:8px">' + L('Sair', 'Sign out') + '</button></nav>';
  }
  function timeline(o) {
    var idx = STEPS.indexOf(o.status);
    return '<ol class="steps">' + STEPS.map(function (s, i) {
      var cls = i === idx && s === 'imprimir' ? ' class="bar-stripes"' : '';
      var col = i < idx ? '#22C07A' : i === idx ? STEP_COL[s] : 'var(--line)';
      return '<li style="color:' + (i <= idx ? '#fff' : 'var(--mute)') + '"><span' + cls + ' style="background-color:' + col + '"></span>' + sn(s) + '</li>';
    }).join('') + '</ol>';
  }
  function areaView(u) {
    var os = myOrders(u), tab = st.tab, out = '';
    if (tab === 'resumo') {
      var live = os.filter(function (o) { return o.status !== 'entregue'; })[0];
      out = '<h1 class="h-l">' + L('Olá, ', 'Hi, ') + XF.esc(u.name.split(' ')[0]) + '.</h1>' +
        (live ? '<button type="button" class="row" style="background:#FF5A1F;color:var(--ink);flex-direction:column;align-items:flex-start" data-order="' + live.id + '"><span class="mono" style="font-weight:700;font-size:13px;letter-spacing:.1em">' + sn(live.status).toUpperCase() + ' · ' + live.id + '</span><span style="font-size:24px;font-weight:900">' + XF.esc(live.items.map(function (i) { return i.qty + '× ' + i.name; }).join(', ')) + '</span><span style="font-weight:700">' + L('Ver detalhes →', 'See details →') + '</span></button>'
              : '<div class="card card-pad" style="display:flex;flex-direction:column;gap:12px;align-items:flex-start"><span style="font-size:22px;font-weight:900">' + L('Ainda não tens encomendas.', 'No orders yet.') + '</span><a class="btn btn-orange" href="loja.html">' + L('Ir à loja', 'Go to the shop') + '</a></div>') +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px"><button type="button" class="row" data-tab="encomendas" style="flex-direction:column;align-items:flex-start"><span style="font-size:30px;font-weight:900;color:#FF5A1F">' + os.length + '</span>' + L('encomendas', 'orders') + '</button><button type="button" class="row" data-tab="moradas" style="flex-direction:column;align-items:flex-start"><span style="font-size:30px;font-weight:900;color:#FFB020">' + (u.addresses || []).length + '</span>' + L('moradas guardadas', 'saved addresses') + '</button><button type="button" class="row" data-tab="lab" style="flex-direction:column;align-items:flex-start"><span style="font-size:30px;font-weight:900;color:#22C07A">Lab</span>' + (u.lab ? L('estás na lista', 'you are on the list') : L('não estás na lista', 'not on the list')) + '</button></div>';
    }
    if (tab === 'encomendas' && !st.order) {
      out = '<h1 class="h-l">' + L('Encomendas', 'Orders') + '</h1>' + (os.length ? os.map(function (o) {
        return '<button type="button" class="row" data-order="' + o.id + '"><span style="display:flex;flex-direction:column;gap:4px"><span class="mono small" style="font-weight:700">' + (o.code || o.id) + ' · ' + new Date(o.date).toLocaleDateString(XF.lang) + '</span><span style="font-size:18px;font-weight:800">' + XF.esc(o.items.map(function (i) { return i.qty + '× ' + i.name; }).join(', ')) + '</span></span><span style="display:flex;align-items:center;gap:14px"><span class="status" style="background:' + STEP_COL[o.status] + '">' + sn(o.status) + '</span><span class="mono" style="font-weight:700">' + XF.euro(o.total) + '</span></span></button>';
      }).join('') : '<p class="lead">' + L('Ainda não fizeste nenhuma encomenda.', 'You have not placed any orders yet.') + '</p>');
    }
    if (tab === 'encomendas' && st.order) {
      var o = os.filter(function (x) { return x.id === st.order; })[0];
      if (!o) { st.order = null; return areaView(u); }
      var z = XF.SHIP[o.zone];
      out = '<button type="button" class="btn btn-ghost" data-back style="align-self:flex-start">← ' + L('Encomendas', 'Orders') + '</button>' +
        '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end"><div><span class="mono small" style="font-weight:700">' + (o.code || o.id) + '</span><h1 class="h-m">' + XF.esc(o.items.map(function (i) { return i.qty + '× ' + i.name + (i.custom ? ' "' + i.custom + '"' : ''); }).join(', ')) + '</h1></div><span class="status" style="background:' + STEP_COL[o.status] + '">' + sn(o.status) + '</span></div>' + timeline(o) +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px"><div class="card card-pad"><span class="mono small" style="font-weight:700">' + L('ENTREGA', 'DELIVERY') + '</span><p style="margin:6px 0 0">' + XF.esc(o.address.line) + '<br>' + XF.esc(o.address.zip + ' ' + o.address.city) + '</p><p class="small" style="margin:6px 0 0">CTT · ' + XF.esc(XF.f(z)) + ' · ' + XF.esc(XF.f(z.days)) + '</p></div>' +
        '<div class="card card-pad"><span class="mono small" style="font-weight:700">' + L('PAGAMENTO', 'PAYMENT') + '</span><p style="margin:6px 0 0">' + ({ mbway: 'MB WAY', mb_way: 'MB WAY', multibanco: 'Multibanco', cartao: L('Cartão', 'Card'), card: L('Cartão', 'Card') }[o.method] || 'Stripe') + '</p><p class="small" style="margin:6px 0 0">' + L('Portes ', 'Shipping ') + (o.shipping == null ? L('a combinar', 'to be agreed') : XF.euro(o.shipping)) + ' · Total ' + XF.euro(o.total) + '</p></div></div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:10px"><button type="button" class="btn btn-orange" data-reorder="' + o.id + '">' + L('Voltar a encomendar', 'Order again') + '</button>' +
        (o.status === 'fila' || o.status === 'paga' ? '<button type="button" class="btn btn-ghost" data-cancel="' + o.id + '">' + L('Cancelar encomenda', 'Cancel order') + '</button>' : '') +
        '<a class="btn btn-ghost" href="mailto:' + XF.EMAIL + '?subject=' + encodeURIComponent(L('Ajuda com a encomenda ', 'Help with order ') + o.id) + '">' + L('Preciso de ajuda', 'I need help') + '</a>' +
        (XF.TEST && o.status !== 'entregue' ? '<button type="button" class="btn btn-green" data-next="' + o.id + '">' + L('Teste: avançar fase', 'Test: next step') + '</button>' : '') + '</div>';
    }
    if (tab === 'moradas') {
      var as = u.addresses || [];
      out = '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px"><h1 class="h-l">' + L('Moradas', 'Addresses') + '</h1><button type="button" class="btn btn-white" data-addaddr>' + (st.adding ? L('Cancelar', 'Cancel') : L('Nova morada', 'New address')) + '</button></div>' +
        (st.adding ? '<form id="addr" class="card card-pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end"><label class="field">' + L('Nome da morada', 'Label') + '<input name="label" placeholder="' + L('Casa', 'Home') + '"></label><label class="field" style="grid-column:span 2">' + L('Morada', 'Address') + '<input name="line" autocomplete="street-address"></label><label class="field">' + L('Código postal', 'Postcode') + '<input name="zip" autocomplete="postal-code"></label><label class="field">' + L('Localidade', 'City') + '<input name="city" autocomplete="address-level2"></label><label class="field">' + L('País', 'Country') + '<select name="country">' + XF.countries().map(function (c) { return '<option value="' + c.code + '">' + XF.esc(c.name) + '</option>'; }).join('') + '</select></label><button type="submit" class="btn btn-orange">' + L('Guardar morada', 'Save address') + '</button></form>' : '') +
        (as.length ? as.map(function (a, i) { return '<div class="card card-pad" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;border:2px solid ' + (a.def ? '#22C07A' : 'transparent') + '"><span><b style="font-size:18px">' + XF.esc(a.label) + '</b>' + (a.def ? ' <span class="status" style="background:#22C07A;font-size:12px;padding:3px 8px">' + L('PREDEFINIDA', 'DEFAULT') + '</span>' : '') + '<br><span class="muted">' + XF.esc(a.line + ', ' + (a.zip || '') + ' ' + (a.city || '')) + '</span></span><span style="display:flex;gap:8px">' + (a.def ? '' : '<button type="button" class="btn btn-ghost" data-defaddr="' + i + '">' + L('Tornar predefinida', 'Make default') + '</button>') + '<button type="button" class="link-btn" style="color:#FF8A8A" data-deladdr="' + i + '">' + L('Apagar', 'Delete') + '</button></span></div>'; }).join('') : '<p class="lead">' + L('Ainda não tens moradas guardadas. A primeira compra guarda uma sozinha.', 'No saved addresses yet. Your first order saves one automatically.') + '</p>');
    }
    if (tab === 'guardados') {
      var favs = XF.load('xf-favs', []);
      out = '<h1 class="h-l">' + L('Nomes e favoritos', 'Names and favourites') + '</h1><div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start"><div class="card card-pad" style="flex:1 1 300px;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:22px;font-weight:900">' + L('Nomes guardados', 'Saved names') + '</h2><p class="muted" style="margin:0;font-size:15px">' + L('Para os produtos com nome.', 'For name products.') + '</p><div class="chips">' +
        (u.names || []).map(function (n, i) { return '<span style="display:inline-flex;align-items:center;gap:6px;background:#FF5A1F;color:var(--ink);font-weight:800;padding:6px 6px 6px 14px;border-radius:999px">' + XF.esc(n) + '<button type="button" data-delname="' + i + '" aria-label="' + L('Tirar', 'Remove') + ' ' + XF.esc(n) + '" style="width:30px;height:30px;border-radius:999px;border:0;background:rgba(10,15,31,.15);cursor:pointer">×</button></span>'; }).join('') +
        '</div><form id="nameform" style="display:flex;gap:8px"><label class="sr" for="newname">' + L('Novo nome', 'New name') + '</label><input id="newname" class="input" maxlength="10" placeholder="' + L('Novo nome', 'New name') + '"><button type="submit" class="btn btn-white">' + L('Juntar', 'Add') + '</button></form></div>' +
        '<div class="card card-pad" style="flex:1 1 300px;display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:22px;font-weight:900">' + L('Favoritos', 'Favourites') + '</h2>' +
        (favs.length ? favs.map(function (id) { var p = XF.product(id); if (!p) return ''; return '<div style="display:flex;align-items:center;gap:12px"><span style="width:48px;height:48px;border-radius:12px;background:' + p.tile + '"></span><span style="flex:1"><b>' + XF.esc(XF.pt(p).name) + '</b><br><span class="mono small">' + XF.euro(p.price) + '</span></span><button type="button" class="btn btn-orange" data-favadd="' + id + '">' + XF.t('add') + '</button></div>'; }).join('') : '<p class="muted" style="margin:0">' + L('Ainda não tens favoritos. Toca no coração na loja.', 'No favourites yet. Tap the heart in the shop.') + '</p>') + '</div></div>';
    }
    if (tab === 'lab') {
      var ideas = XF.API ? (u.ideas || []) : XF.load('xf-lab', []); if (!Array.isArray(ideas)) ideas = [];
      if (!XF.API) ideas = ideas.filter(function (x) { return x && typeof x === 'object' && x.email === u.email; });
      out = '<section style="border:2px solid #22C07A;border-radius:28px;padding:clamp(22px,4vw,40px);display:flex;flex-direction:column;gap:16px"><span class="mono" style="font-weight:700;letter-spacing:.14em;color:#22C07A">XYLOFAB LAB</span><h1 class="h-l">' + L('A tua ideia, connosco.', 'Your idea, with us.') + '</h1>' +
        '<ol style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:17px"><li>' + L('Contas-nos a ideia em poucas linhas, sem segredos.', 'You tell us the idea in a few lines, no secrets.') + '</li><li>' + L('Assinamos os dois um NDA (acordo de confidencialidade).', 'We both sign an NDA (non-disclosure agreement).') + '</li><li>' + L('Desenhamos, imprimimos protótipos e afinamos contigo.', 'We design, print prototypes and fine-tune with you.') + '</li></ol>' +
        '<a class="btn btn-green btn-big" href="index.html#lab-ideia" style="align-self:flex-start">' + L('Contar uma ideia', 'Tell us an idea') + '</a>' +
        (ideas.length ? '<div style="display:flex;flex-direction:column;gap:10px"><b>' + L('As tuas ideias enviadas', 'Ideas you sent') + '</b>' + ideas.map(function (x) { return '<div class="card card-pad"><span class="mono small">' + new Date(x.at).toLocaleDateString(XF.lang) + ' · ' + L('À ESPERA DO NDA', 'WAITING FOR NDA') + '</span><p style="margin:6px 0 0">' + XF.esc(x.idea) + '</p></div>'; }).join('') + '</div>' : '') +
        '<label class="check" style="font-weight:800"><input type="checkbox" data-lab' + (u.lab ? ' checked' : '') + ' style="accent-color:#22C07A;width:24px;height:24px">' + L('Quero saber das novidades do Lab', 'Tell me about Lab news') + '</label></section>';
    }
    if (tab === 'opinioes') {
      var done = os.filter(function (o) { return o.status === 'entregue'; });
      out = '<h1 class="h-l">' + L('Opiniões', 'Reviews') + '</h1>' + (done.length ? done.map(function (o) {
        if (o.review) return '<div class="card card-pad"><b>' + (o.code || o.id) + '</b> · <span style="color:#FFB020">' + '★★★★★'.slice(0, o.review.stars) + '</span><p class="muted" style="margin:6px 0 0">' + XF.esc(o.review.text) + '</p><p class="small" style="margin:6px 0 0">' + (o.review.state === 'aprovada' ? L('Aprovada. Já está no site.', 'Approved. It is on the site now.') : o.review.state === 'recusada' ? L('Não foi publicada.', 'It was not published.') : L('À espera de aprovação para aparecer no site.', 'Waiting for approval before it shows on the site.')) + '</p></div>';
        var r = st.rating[o.id] || 0;
        return '<form class="card card-pad" data-review="' + o.id + '" style="display:flex;flex-direction:column;gap:12px"><b>' + L('Como ficou ', 'How was ') + XF.esc(o.items[0].name) + '?</b><div style="display:flex;gap:6px" role="group" aria-label="' + L('Estrelas', 'Stars') + '">' + [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" class="star" data-star="' + o.id + ':' + n + '" aria-pressed="' + (n <= r) + '" aria-label="' + n + '/5">★</button>'; }).join('') + '</div><label class="field">' + L('Em poucas palavras', 'In a few words') + '<textarea name="text"></textarea></label><label class="check"><input type="checkbox" name="public" checked><span>' + L('Podem mostrar no site com as minhas iniciais', 'You may show it on the site with my initials') + '</span></label><div><button type="submit" class="btn btn-orange">' + L('Enviar opinião', 'Send review') + '</button></div></form>';
      }).join('') : '<p class="lead">' + (XF.API ? L('Quando uma encomenda for entregue, podes avaliá-la aqui.', 'Once an order is delivered you can review it here.') : L('Quando uma encomenda for entregue, podes avaliá-la aqui. (No teste, usa "avançar fase" numa encomenda até ficar entregue.)', 'Once an order is delivered you can review it here. (In test mode, use "next step" on an order until it is delivered.)')) + '</p>');
    }
    if (tab === 'definicoes') {
      out = '<h1 class="h-l">' + L('Definições', 'Settings') + '</h1>' +
        '<form id="prof" class="card card-pad" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end"><h2 style="margin:0;font-size:20px;font-weight:900;grid-column:1/-1">' + L('Os meus dados', 'My details') + '</h2><label class="field">' + L('Nome', 'Name') + '<input name="name" value="' + XF.esc(u.name) + '" autocomplete="name"></label><label class="field">Email<input value="' + XF.esc(u.email) + '" disabled></label><label class="field">' + L('Palavra-passe nova', 'New password') + '<input name="pw" type="password" autocomplete="new-password"></label><button type="submit" class="btn btn-orange">' + L('Guardar', 'Save') + '</button></form>' +
        '<div class="card card-pad" style="display:flex;flex-direction:column;gap:10px"><h2 style="margin:0;font-size:20px;font-weight:900">' + L('Avisos', 'Notifications') + '</h2><label class="check"><input type="checkbox" data-pref="notifyEmail"' + (u.notifyEmail !== false ? ' checked' : '') + '>' + L('Por email', 'By email') + '</label><label class="check"><input type="checkbox" data-pref="notifyWa"' + (u.notifyWa ? ' checked' : '') + ' style="accent-color:#22C07A">' + L('Por WhatsApp', 'By WhatsApp') + '</label>' +
        (u.notifyWa ? '<label class="field" style="max-width:320px">' + L('O teu número de WhatsApp', 'Your WhatsApp number') + '<input data-wa type="tel" autocomplete="tel" value="' + XF.esc(u.wa || '') + '"></label>' : '') +
        '<label class="field" style="max-width:260px">' + L('Língua', 'Language') + '<select data-langsel>' + ['pt', 'en', 'es', 'fr', 'de', 'it', 'nl', 'pl', 'ro', 'sv', 'da', 'fi', 'el', 'cs', 'sk', 'hu', 'bg', 'hr', 'sl', 'et', 'lv', 'lt', 'mt', 'ga'].map(function (c) { return '<option value="' + c + '"' + (c === XF.lang ? ' selected' : '') + '>' + c.toUpperCase() + '</option>'; }).join('') + '</select></label></div>' +
        '<div class="card card-pad" style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0;font-size:20px;font-weight:900">' + L('Privacidade', 'Privacy') + '</h2><div style="display:flex;flex-wrap:wrap;gap:10px"><button type="button" class="btn btn-ghost" data-export>' + L('Descarregar os meus dados', 'Download my data') + '</button>' + (st.confirm ? '' : '<button type="button" class="btn btn-ghost" style="border-color:#FF8A8A;color:#FF8A8A" data-askdel>' + L('Apagar a conta', 'Delete my account') + '</button>') + '</div>' +
        (st.confirm ? '<div role="alert" style="background:#2A1218;border:1px solid #FF8A8A;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px"><b>' + L('Tens a certeza? Apagamos a conta, as moradas e os nomes guardados.', 'Are you sure? We delete your account, addresses and saved names.') + '</b><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn" style="background:#FF8A8A;color:var(--ink)" data-dodel>' + L('Sim, apagar', 'Yes, delete') + '</button><button type="button" class="btn btn-ghost" data-nodel>' + L('Cancelar', 'Cancel') + '</button></div></div>' : '') + '</div>';
    }
    return '<div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">' + navView(u) + '<section style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px;animation:rise .4s ease both">' + out + '</section></div>';
  }

  function render() {
    var u = XF.profile();
    $('app').innerHTML = u ? areaView(u) : authView();
  }
  function rerenderHeader() { XF.mount(); }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target, el;
    if ((el = t.closest('[data-mode]'))) { st.mode = el.dataset.mode; st.error = ''; render(); return; }
    if ((el = t.closest('[data-tab]'))) { st.tab = el.dataset.tab; st.order = null; st.confirm = false; render(); scrollTo(0, 0); return; }
    if ((el = t.closest('[data-order]'))) { st.tab = 'encomendas'; st.order = el.dataset.order; render(); return; }
    if (t.closest('[data-back]')) { st.order = null; render(); return; }
    if (t.closest('[data-logout]')) { XF.logout(); rerenderHeader(); render(); return; }
    var u = XF.profile(); if (!u) return;
    var orders = XF.orders(), find = function (id) { return orders.filter(function (o) { return o.id === id; })[0]; };
    if ((el = t.closest('[data-next]'))) { var o = find(el.dataset.next); o.status = STEPS[Math.min(STEPS.length - 1, STEPS.indexOf(o.status) + 1)]; XF.save('xf-orders', orders); XF.toast(L('Fase: ', 'Step: ') + sn(o.status)); render(); return; }
    if ((el = t.closest('[data-cancel]')) && XF.API) { el.disabled = true; XF.cancelOrder(el.dataset.cancel).then(function () { st.order = null; XF.toast(L('Encomenda cancelada. O dinheiro vai ser devolvido.', 'Order cancelled. The money will be refunded.')); render(); }, function (err) { el.disabled = false; XF.toast(err.message); }); return; }
    if ((el = t.closest('[data-cancel]'))) { XF.save('xf-orders', orders.filter(function (o) { return o.id !== el.dataset.cancel; })); st.order = null; XF.toast(L('Encomenda cancelada. No site real, o dinheiro é devolvido.', 'Order cancelled. On the live site the money is refunded.')); render(); return; }
    if ((el = t.closest('[data-reorder]'))) { find(el.dataset.reorder).items.forEach(function (i) { XF.addToCart(i.id, { color: i.color, custom: i.custom, qty: i.qty }); }); return; }
    if (t.closest('[data-addaddr]')) { st.adding = !st.adding; render(); return; }
    if ((el = t.closest('[data-defaddr]'))) { u.addresses.forEach(function (a, i) { a.def = i === +el.dataset.defaddr; }); XF.saveProfile(u); render(); return; }
    if ((el = t.closest('[data-deladdr]'))) { var was = u.addresses[+el.dataset.deladdr].def; u.addresses.splice(+el.dataset.deladdr, 1); if (was && u.addresses[0]) u.addresses[0].def = true; XF.saveProfile(u); render(); return; }
    if ((el = t.closest('[data-delname]'))) { u.names.splice(+el.dataset.delname, 1); XF.saveProfile(u); render(); return; }
    if ((el = t.closest('[data-favadd]'))) { var p = XF.product(el.dataset.favadd); if (p.personal) location.href = 'loja.html?ver=' + p.id; else XF.addToCart(p.id); return; }
    if ((el = t.closest('[data-star]'))) { var parts = el.dataset.star.split(':'); st.rating[parts[0]] = +parts[1]; render(); return; }
    if (t.closest('[data-export]') && XF.API) { XF.exportData().then(function (d) { var a2 = document.createElement('a'); a2.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' })); a2.download = 'xylofab-os-meus-dados.json'; a2.click(); }, function (err) { XF.toast(err.message); }); return; }
    if (t.closest('[data-export]')) {
      var data = { conta: u, encomendas: myOrders(u), favoritos: XF.load('xf-favs', []) }; delete data.conta.pw;
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })); a.download = 'xylofab-os-meus-dados.json'; a.click(); return;
    }
    if (t.closest('[data-askdel]')) { st.confirm = true; render(); return; }
    if (t.closest('[data-nodel]')) { st.confirm = false; render(); return; }
    if (t.closest('[data-dodel]') && XF.API) { XF.deleteAccount().then(function () { st.confirm = false; rerenderHeader(); render(); XF.toast(L('Conta apagada.', 'Account deleted.')); }, function (err) { XF.toast(err.message); }); return; }
    if (t.closest('[data-dodel]')) { var us = XF.load('xf-users', {}); delete us[u.email]; XF.save('xf-users', us); XF.logout(); st.confirm = false; rerenderHeader(); render(); XF.toast(L('Conta apagada.', 'Account deleted.')); return; }
  });
  document.addEventListener('change', function (e) {
    var u = XF.profile(); if (!u) return; var t = e.target;
    if (t.matches('[data-lab]')) { u.lab = t.checked; XF.saveProfile(u); render(); }
    if (t.matches('[data-pref]')) { u[t.dataset.pref] = t.checked; XF.saveProfile(u); render(); }
    if (t.matches('[data-wa]')) { u.wa = t.value; XF.saveProfile(u); XF.toast(L('Guardado.', 'Saved.')); }
    if (t.matches('[data-langsel]')) XF.setLang(t.value);
  });
  document.addEventListener('submit', function (e) {
    var f = e.target; e.preventDefault();
    if (f.id === 'auth') {
      var email = ($('a-email') || {}).value || '', pw = ($('a-pw') || {}).value || '';
      st.email = email;
      if (st.mode === 'signup') {
        st.name = $('a-name').value;
        if (!st.name.trim()) st.error = L('Falta o teu nome.', 'Your name is missing.');
        else if (!XF.validEmail(email)) st.error = L('Esse email não parece certo.', 'That email does not look right.');
        else if (pw.length < 8) st.error = L('A palavra-passe precisa de 8 caracteres ou mais.', 'The password needs 8 characters or more.');
        else if (!$('a-terms').checked) st.error = L('Falta aceitares os termos.', 'Please accept the terms.');
        else st.error = '';
        if (st.error) return render();
        XF.signup(st.name, email, pw, $('a-lab').checked).then(done, fail);
      } else if (st.mode === 'login') {
        if (!XF.validEmail(email)) { st.error = L('Esse email não parece certo.', 'That email does not look right.'); return render(); }
        XF.login(email, pw).then(done, fail);
      } else if (st.mode === 'forgot') {
        if (!XF.validEmail(email)) { st.error = L('Esse email não parece certo.', 'That email does not look right.'); return render(); }
        if (XF.API) { XF.forgot(email).then(function () { st.mode = 'sent'; st.error = ''; render(); }, fail); return; }
        st.mode = 'sent'; st.error = ''; render();
      } else if (st.mode === 'reset') {
        var np = ($('a-newpw') || {}).value || '';
        if (np.length < 8) { st.error = L('A palavra-passe precisa de 8 caracteres ou mais.', 'The password needs 8 characters or more.'); return render(); }
        XF.resetPassword(qs.get('repor'), np).then(function (u2) { history.replaceState(null, '', 'conta.html'); done(u2); }, fail);
      }
      return;
    }
    var u = XF.profile(); if (!u) return;
    if (f.id === 'addr') {
      var d = new FormData(f);
      if (!String(d.get('line')).trim()) { XF.toast(L('Falta a morada.', 'The address is missing.')); return; }
      u.addresses = u.addresses || [];
      u.addresses.push({ label: String(d.get('label')).trim() || L('Morada', 'Address'), line: String(d.get('line')), zip: String(d.get('zip')), city: String(d.get('city')), country: String(d.get('country')), region: 'cont', def: !u.addresses.length });
      XF.saveProfile(u); st.adding = false; XF.toast(L('Morada guardada.', 'Address saved.')); render();
    }
    if (f.id === 'nameform') { var n = $('newname').value.trim().toUpperCase().slice(0, 10); if (n && (u.names || []).indexOf(n) < 0) { u.names = (u.names || []).concat(n); XF.saveProfile(u); } render(); }
    if (f.id === 'prof') {
      var fd = new FormData(f); u.name = String(fd.get('name')).trim() || u.name;
      var newpw = String(fd.get('pw'));
      var fin = function () { XF.saveProfile(u); rerenderHeader(); render(); XF.toast(L('Guardado.', 'Saved.')); };
      if (newpw && XF.API) { if (newpw.length < 8) { XF.toast(L('A palavra-passe precisa de 8 caracteres ou mais.', 'The password needs 8 characters or more.')); return; } XF.changePassword(newpw).then(fin, function (err) { XF.toast(err.message); }); return; }
      if (newpw) { if (newpw.length < 8) { XF.toast(L('A palavra-passe precisa de 8 caracteres ou mais.', 'The password needs 8 characters or more.')); return; } XF.hash(newpw).then(function (h) { u.pw = h; fin(); }); } else fin();
    }
    if (f.dataset.review) {
      var id = f.dataset.review, stars = st.rating[id] || 0;
      if (!stars) { XF.toast(L('Escolhe as estrelas primeiro.', 'Pick the stars first.')); return; }
      if (XF.API) { XF.review(id, stars, f.querySelector('[name=text]').value, f.querySelector('[name=public]').checked).then(function () { XF.toast(L('Obrigado! Fica à espera de aprovação.', 'Thank you! It is waiting for approval.')); render(); }, function (err) { XF.toast(err.message); }); return; }
      var orders = XF.orders(); orders.forEach(function (o) { if (o.id === id) o.review = { stars: stars, text: f.querySelector('[name=text]').value, public: f.querySelector('[name=public]').checked }; });
      XF.save('xf-orders', orders); XF.toast(L('Obrigado! Fica à espera de aprovação.', 'Thank you! It is waiting for approval.')); render();
    }
  });
  function done(u) {
    st.error = ''; rerenderHeader();
    if (qs.get('depois') === 'carrinho') { location.href = 'carrinho.html?passo=dados'; return; }
    render(); XF.toast(L('Olá, ', 'Hi, ') + u.name.split(' ')[0] + '!');
  }
  function fail(err) { st.error = err.message; render(); }
  document.addEventListener('DOMContentLoaded', render);
  document.addEventListener('xf:lang', render);
  document.addEventListener('xf:me', render);
})();
</script>
</body>
</html>
